background_illness:
  p_symptomatic: 0.08
  p_self_report: 0.25
  symptoms: {diarrhea: 0.35, cramps: 0.60, fever: 0.10, vomiting: 0.25, bloody_stool: 0.0}
  onset_hours: {from: -36, to: 108}
foods:
  - {id: chicken_salad, label: Chicken salad sandwiches, p_eaten: 0.55}
  - {id: coleslaw, label: Coleslaw, p_eaten: 0.35, conditional_on: chicken_salad, p_if_exposed: 0.80, p_if_unexposed: 0.20}
  - {id: fried_rice, label: Fried rice, p_eaten: 0.50}
  - {id: cake, label: Chocolate cake, p_eaten: 0.70}
  - {id: punch, label: Fruit punch, p_eaten: 0.60}
menu_order: [cake, punch, fried_rice, coleslaw, chicken_salad]
truth:
  vehicle: chicken_salad
  attack_rate_exposed: 0.60
  attack_rate_unexposed: 0.05
  process_failure: Chicken was cooked in one large batch without a temperature check, then cooled slowly in a deep stock pot overnight.
recall: {p_forget_item: 0.03, p_false_item: 0.02}
reporting: {p_self_report: 0.80}
response: {p_respond_ill: 0.95, p_respond_well: 0.85}
lab: {stool_sensitivity: 0.85, food_sensitivity: 1.0}
analysis: {stratifier: coleslaw}
cook:
  dish: chicken_salad
  preparation: I cooked the chicken in one big batch without checking its temperature, then left it cooling in a deep stock pot overnight. I mixed the salad the next day and brought it to the hall.
  # Clues that optional assisted dialogue must keep word for word when it rephrases the account.
  locked_terms: [chicken, cooked, temperature, cooling, deep stock pot, overnight, mixed]
interviews: {suggested: 4, max: 6, minutes_per_topic: 5}
tasks:
  - {id: guest_list, label: Request the RSVP list, effort_min: 10, turnaround_hours: 2}
  - {id: team_interviews, label: Send the collection team, effort_min: 15, turnaround_hours: 24}
  - {id: stool_samples, label: Request stool samples, effort_min: 10, turnaround_hours: 48}
  - {id: hold_leftovers, label: Preserve the leftovers, effort_min: 5, turnaround_hours: 0, window_closes_hour: 24}
  - {id: leftover_testing, label: Test preserved leftovers, requires: hold_leftovers, effort_min: 10, turnaround_hours: 72}
  - {id: food_prep_review, label: Environmental health review, effort_min: 10, turnaround_hours: 24}
actions:
  - {id: advise_guests, label: Advise guests on hygiene and severe illness, justified_if: cluster_confirmed}
  - {id: discard_leftovers, label: Ask guests to discard leftovers taken home, justified_if: leftovers_taken_home}
  - {id: refer_environmental_health, label: Refer to environmental health, justified_if: cluster_confirmed}
  - {id: food_handler_guidance, label: Recommend safe cooking and cooling guidance, justified_if: process_failure_known}
  - {id: close_hall, label: Recommend closing the hall, justified_if: ongoing_exposure}
  - {id: public_notice, label: Recommend a public notice, justified_if: ongoing_exposure}
events:
  - {id: press-call, type: media, at_hour: 36, source: Local reporter, text: "A reporter asks whether the potluck food caused illness and whether the hall should close. Explain what is known, uncertain, and being done."}
