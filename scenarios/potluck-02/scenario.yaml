  leftovers_taken_home: true
  ongoing_exposure: false
briefing:
  source: Pat · initial call
  finding: Several guests report illness after the potluck on Saturday 6 June. Exposure at the hall ended Saturday night. The fridge will be cleared Tuesday at 09:00.
pathogen:
  name: Salmonella Enteritidis
  incubation_hours: {median: 24, p95: 60}
  symptoms: {diarrhea: 0.90, cramps: 0.80, fever: 0.70, vomiting: 0.30, bloody_stool: 0.10}
