name: R simulator checks
on: [push, pull_request]
jobs:
  test:
    # Pinned: the deployment manifest records the package repository for this
    # Ubuntu release, so a moving "latest" image makes it drift.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        r-version: ['4.6.0', '4.6.1']
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libicu-dev zlib1g-dev
      - name: Cache the restored library
        uses: actions/cache@v4
        with:
          path: |
            artifacts/library
            artifacts/renv-cache
            artifacts/renv-root
          key: renv-${{ runner.os }}-ubuntu-24.04-r${{ matrix.r-version }}-${{ hashFiles('renv.lock', 'setup.R') }}
      - name: Restore locked dependencies
        run: Rscript setup.R
      - name: Initialize Shiny application
        run: Rscript -e 'stopifnot(inherits(source("app.R")$value, "shiny.appobj"))'
      - run: Rscript tests/run.R
      - run: Rscript scripts/review-seed.R
      - run: Rscript scripts/review-scenarios.R
      - run: git diff --exit-code -- docs/seed-review.md docs/scenario-review.md
      - name: Generate Connect Cloud manifest
        if: matrix.r-version == '4.6.0'
        run: Rscript scripts/write-connect-manifest.R
      - uses: actions/upload-artifact@v4
        if: matrix.r-version == '4.6.0'
        with:
          name: connect-cloud-manifest
          path: manifest.json
          if-no-files-found: error
      - name: Check deployment manifest drift
        if: matrix.r-version == '4.6.0'
        run: git diff --exit-code -- manifest.json
  lint:
    # Static checks only: no project library needed, so lintr stays out of the lockfile.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install lintr
        run: Rscript -e 'install.packages("lintr")'
      - run: Rscript scripts/lint.R
