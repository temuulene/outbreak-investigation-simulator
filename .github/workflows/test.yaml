name: R simulator checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Restore locked dependencies
        run: Rscript setup.R
      - run: Rscript tests/run.R
      - run: Rscript scripts/review-seed.R
      - run: Rscript scripts/review-scenarios.R
      - run: git diff --exit-code -- docs/seed-review.md docs/scenario-review.md
